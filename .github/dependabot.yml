version: 2
updates:
  # Dépendances PHP (Dompdf en production, PHPUnit en dev, cf. composer.json).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "composer"

  # Actions utilisées par .github/workflows/ci.yml (actions/checkout...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
