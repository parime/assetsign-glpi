version: 2
updates:
  # Dépendances PHP (Dompdf en production, PHPUnit en dev, cf. composer.json).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "composer"
    # 7 jours avant de proposer une version tout juste publiée (cf. Semgrep
    # dependabot-missing-cooldown) : laisse le temps a la communaute de
    # detecter un paquet compromis/instable avant qu'on ne l'adopte.
    cooldown:
      default-days: 7

  # Actions utilisées par .github/workflows/ci.yml (actions/checkout...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7

  # Bibliotheques JS vendorisees dans public/js/sign/vendor/ (PDF.js, signature_pad),
  # copiees a la main plutot que via un bundler npm (pas de build JS dans ce plugin) -
  # package.json/package-lock.json n'existent QUE pour permettre ce suivi de version
  # (cf. package.json, TROUBLESHOOTING.md). Une PR Dependabot ici signale une nouvelle
  # version disponible mais ne met PAS a jour les fichiers vendorises automatiquement -
  # ca reste une mise a jour manuelle (verification des changements cassants, test
  # complet du flux de signature au navigateur avant de vendoriser la nouvelle version).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "js-vendor"
    cooldown:
      default-days: 7
