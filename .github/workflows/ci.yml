name: CI

# Reproduit exactement l'environnement de test utilise manuellement en
# developpement (image officielle glpi/glpi + MariaDB, cf. README section
# Tests automatises) : lint PHP, migration reelle du plugin, puis PHPUnit.
# Sans ce fichier, la seule verification avant un push etait manuelle (lancee
# a la main dans un conteneur Docker local) -- rien ne la relancait
# automatiquement, ni n'alertait en cas d'oubli.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  GLPI_IMAGE: glpi/glpi:11.0.8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupère le code du plugin
        uses: actions/checkout@v7

      - name: Audit de sécurité des bibliothèques JS vendorisées
        # package.json/package-lock.json ne declarent QUE les versions des
        # bibliotheques copiees a la main dans public/js/sign/vendor/ (PDF.js,
        # signature_pad) - aucun build/bundling npm dans ce plugin, cf.
        # package.json. npm audit reste pertinent malgre tout : il verifie ces
        # versions declarees contre la base d'avisories npm, exactement comme
        # composer audit le fait cote PHP. Node.js est deja fourni par le
        # runner ubuntu-latest, pas besoin de Docker pour cette etape.
        run: npm audit

      - name: Valide composer.json/composer.lock
        # Rapide (pas besoin de PHP/Docker), echoue avant meme de demarrer les
        # conteneurs si le fichier est mal forme ou desynchronise du lock.
        # Composer lui-meme n'est fourni ni par le runner ni par l'image
        # glpi/glpi (meme piege que l'etape "Installe les dependances de dev"
        # plus bas, qui l'installe de la meme facon) : recupere directement
        # via getcomposer.org, sans dependre d'une action tierce non verifiee.
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/tmp --filename=composer.phar
          php /tmp/composer.phar validate

      - name: Démarre MariaDB
        run: |
          docker network create remise-ci
          docker run -d --name mariadb --network remise-ci \
            -e MARIADB_ROOT_PASSWORD=glpi_password \
            -e MARIADB_DATABASE=glpidb \
            -e MARIADB_USER=glpi_user \
            -e MARIADB_PASSWORD=glpi_password \
            mariadb:11

          echo "Attente que MariaDB accepte les connexions..."
          for i in $(seq 1 30); do
            docker exec mariadb mariadb-admin ping -h 127.0.0.1 -u root -pglpi_password --silent && break
            sleep 2
          done

      - name: Démarre GLPI (auto-installation via l'image officielle)
        run: |
          docker run -d --name glpi --network remise-ci \
            -e TIMEZONE=Europe/Paris \
            -e GLPI_DB_HOST=mariadb \
            -e GLPI_DB_PORT=3306 \
            -e GLPI_DB_NAME=glpidb \
            -e GLPI_DB_USER=glpi_user \
            -e GLPI_DB_PASSWORD=glpi_password \
            "$GLPI_IMAGE"

          # Piege reel rencontre au premier lancement de ce workflow :
          # GLPI_DB_PORT manquant faisait considerer la config DB comme
          # "incomplete" par l'entrypoint de l'image, qui desactivait alors
          # silencieusement l'auto-installation (GLPI_SKIP_AUTOINSTALL force
          # a true) — le noyau GLPI demarre quand meme sans DB configuree,
          # donc une simple verification "le noyau demarre" ne suffit pas a
          # detecter ce cas : on attend explicitement le fichier que
          # l'auto-installation cree en dernier (config_db.php), avec un
          # arret net et les logs du conteneur si ca n'arrive jamais.
          echo "Attente que l'auto-installation de GLPI soit terminee..."
          ready=0
          for i in $(seq 1 60); do
            docker exec glpi test -f /var/glpi/config/config_db.php && { ready=1; break; }
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::GLPI n'a jamais termine son auto-installation (config_db.php absent)."
            docker logs glpi --tail 200
            exit 1
          fi

      - name: Copie le plugin dans le conteneur GLPI
        run: |
          docker exec glpi mkdir -p /var/www/glpi/plugins/remise
          docker cp ./. glpi:/var/www/glpi/plugins/remise
          # Les fichiers copies appartiennent a root (l'utilisateur du
          # checkout), pas www-data (l'utilisateur sous lequel tourne PHP
          # dans ce conteneur, cf. les autres `docker exec` sans -u) : sans ce
          # chown, composer install echoue plus loin en tentant de creer de
          # nouveaux dossiers dans vendor/ ("does not exist and could not be
          # created" alors meme que le dossier a bien les droits d'ecriture
          # pour son PROPRE proprietaire root, juste pas pour www-data).
          docker exec -u root glpi chown -R www-data:www-data /var/www/glpi/plugins/remise

      - name: Lint PHP
        run: |
          docker exec glpi sh -c '
            cd /var/www/glpi/plugins/remise
            fail=0
            for f in $(find src front -name "*.php"); do
              php -l "$f" > /tmp/lintout 2>&1 || { cat /tmp/lintout; fail=1; }
            done
            exit $fail
          '

      - name: Installe les dépendances de dev du plugin (PHPUnit)
        # Le vendor/ commite dans le depot n'embarque volontairement QUE les
        # dependances de production (cf. README, section Prerequis) : PHPUnit
        # n'y est jamais present, il faut le recuperer ici. composer n'est pas
        # fourni par l'image glpi/glpi -> installe a la volee dans /tmp.
        # COMPOSER_HOME doit deja exister et etre exporte AVANT meme le script
        # d'installation de composer.phar lui-meme (pas seulement pour
        # `composer install` ensuite) : sans ca, ce script tente d'ecrire dans
        # le HOME par defaut de www-data, non inscriptible dans ce conteneur.
        run: |
          docker exec glpi sh -c '
            export COMPOSER_HOME=/tmp/composer-home
            mkdir -p "$COMPOSER_HOME"
            cd /tmp
            php -r "copy(\"https://getcomposer.org/installer\", \"composer-setup.php\");"
            php composer-setup.php --install-dir=/tmp --filename=composer.phar
          '
          docker exec glpi sh -c '
            export COMPOSER_HOME=/tmp/composer-home
            cd /var/www/glpi/plugins/remise
            php /tmp/composer.phar install --no-interaction --prefer-dist
          '

      - name: Vérifie le standard de codage officiel GLPI
        # phpcs (pas phpcbf) : echoue la CI plutot que de corriger en silence,
        # jusqu'ici seulement lance manuellement en local (cf. TROUBLESHOOTING.md).
        run: docker exec glpi sh -c "cd /var/www/glpi/plugins/remise && vendor/bin/phpcs --standard=vendor/glpi-project/coding-standard/GlpiStandard/ruleset.xml src front hook.php setup.php"

      - name: Audit de sécurité des dépendances Composer
        # --no-dev : le vendor/ livre en production ne contient QUE les
        # dependances de prod (cf. README > Prerequis) ; sans ce filtre,
        # composer audit echoue systematiquement a cause de
        # glpi-project/coding-standard (dependance dev), marquee "abandoned"
        # sur Packagist - sans lien avec la securite, mais suffisant pour
        # faire echouer la commande (verifie en local avant d'ecrire cette
        # etape). Jusqu'ici seulement lance manuellement (cf. TROUBLESHOOTING.md).
        run: docker exec glpi sh -c "cd /var/www/glpi/plugins/remise && export COMPOSER_HOME=/tmp/composer-home && php /tmp/composer.phar audit --no-dev"

      - name: Installe et active le plugin
        run: |
          docker exec glpi php bin/console plugin:install remise --force --no-interaction
          docker exec glpi php bin/console plugin:activate remise --no-interaction

      - name: Lance PHPUnit
        run: docker exec glpi sh -c "cd /var/www/glpi/plugins/remise && vendor/bin/phpunit"

      - name: Logs GLPI (en cas d'échec)
        if: failure()
        run: docker logs glpi --tail 200
