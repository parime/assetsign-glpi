name: CI

# Reproduit exactement l'environnement de test utilise manuellement en
# developpement (image officielle glpi/glpi + MariaDB, cf. ARCHITECTURE.md
# section Tests automatises) : lint PHP, migration reelle du plugin, puis PHPUnit.
# Sans ce fichier, la seule verification avant un push etait manuelle (lancee
# a la main dans un conteneur Docker local) -- rien ne la relancait
# automatiquement, ni n'alertait en cas d'oubli.
on:
  push:
    branches: [main, dev]
  pull_request:
  # Detecte une regression qui n'apparaitrait qu'avec le temps (nouvelle
  # version de l'image glpi/glpi, avisory de securite publie apres coup sur
  # une dependance deja mergee...) sans attendre un prochain push - ecart
  # constate face a la CI du plugin jumeau glpi-vulnerability-manager qui a
  # deja ce filet de securite.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Annule les executions en cours de la meme branche/PR des qu'un nouveau push
# arrive : sans ca, plusieurs push rapproches (ex: corrections successives
# sur une PR) empilent des runs Docker/GLPI concurrents qui consomment des
# minutes CI pour un resultat qui sera de toute facon remplace.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principe du moindre privilege (alerte CodeQL actions/missing-workflow-permissions) : sans bloc
# explicite, GITHUB_TOKEN recoit les permissions par defaut du depot (souvent plus large que
# necessaire). Aucun job de ce workflow n'ecrit quoi que ce soit (checkout, analyse, tests), un
# seul bloc en lecture seule au niveau du workflow suffit pour tous.
permissions:
  contents: read

env:
  GLPI_IMAGE: glpi/glpi:11.0.8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupère le code du plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep gha-mutable-action-tag)

      - name: Analyse de sécurité du dépôt (Trivy — secrets, mauvaises configurations et vulnérabilités)
        # --scanners vuln,secret,misconfig : le scan de vulnerabilites fait ici
        # double emploi avec composer/npm audit plus bas (meme source de
        # donnees pour la partie dependances), mais volontairement conserve -
        # deux verifications valent mieux qu'aucune en cas de defaillance ou
        # de decalage de l'une des deux. Tourne directement sur le checkout,
        # avant meme Docker : aucun besoin de GLPI pour ce scan.
        #
        # Binaire officiel telecharge directement (pas de `curl | sh`, corrige
        # le 2026-08-12 suite au signalement Semgrep gha-curl-pipe-shell : un
        # `# nosemgrep` sur la ligne concernee ne s'est pas revele fiable a
        # l'interieur d'un bloc `run: |` multi-lignes en pratique, corriger la
        # cause reelle plutot que de s'acharner sur la suppression) : la
        # version taguee est verifiee contre le fichier de checksums SHA256
        # officiellement publie par le projet avant toute extraction/execution,
        # exactement ce que Semgrep recommande dans son propre message.
        run: |
          VERSION="$(curl -sfL https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')"
          curl -sfLO "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          curl -sfLO "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "trivy_${VERSION}_checksums.txt"
          tar xzf "trivy_${VERSION}_Linux-64bit.tar.gz" trivy
          install -m 0755 trivy /usr/local/bin/trivy
          trivy fs --scanners vuln,secret,misconfig --exit-code 1 .

      - name: Audit de sécurité des bibliothèques JS vendorisées
        # package.json/package-lock.json ne declarent QUE les versions des
        # bibliotheques copiees a la main dans public/js/sign/vendor/ (PDF.js,
        # signature_pad) - aucun build/bundling npm dans ce plugin, cf.
        # package.json. npm audit reste pertinent malgre tout : il verifie ces
        # versions declarees contre la base d'avisories npm, exactement comme
        # composer audit le fait cote PHP. Node.js est deja fourni par le
        # runner ubuntu-latest, pas besoin de Docker pour cette etape.
        #
        # Boucle de nouvelle tentative (jusqu'a 3 x 15s) : l'endpoint
        # registry.npmjs.org/-/npm/v1/security/advisories/bulk s'est deja
        # montre transitoirement inaccessible (timeout reseau cote registre
        # npm, reproduit aussi bien en local que sur le runner GitHub -
        # aucun lien avec un pare-feu specifique) - meme raisonnement que la
        # boucle de nouvelle tentative sur database:update plus bas : une
        # panne cote fournisseur externe ne doit pas a elle seule faire
        # echouer une CI qui n'a rien a se reprocher.
        run: |
          for i in 1 2 3; do
            npm audit && exit 0
            echo "npm audit a echoue (tentative $i/3), nouvel essai dans 15s..."
            sleep 15
          done
          npm audit

      - name: Valide composer.json/composer.lock
        # Rapide (pas besoin de PHP/Docker), echoue avant meme de demarrer les
        # conteneurs si le fichier est mal forme ou desynchronise du lock.
        # Composer lui-meme n'est fourni ni par le runner ni par l'image
        # glpi/glpi (meme piege que l'etape "Installe les dependances de dev"
        # plus bas, qui l'installe de la meme facon) : recupere directement
        # via getcomposer.org, sans dependre d'une action tierce non verifiee.
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/tmp --filename=composer.phar
          php /tmp/composer.phar validate

      - name: Démarre MariaDB
        run: |
          docker network create assetsign-ci
          docker run -d --name mariadb --network assetsign-ci \
            -e MARIADB_ROOT_PASSWORD=glpi_password \
            -e MARIADB_DATABASE=glpidb \
            -e MARIADB_USER=glpi_user \
            -e MARIADB_PASSWORD=glpi_password \
            mariadb:11

          echo "Attente que MariaDB accepte les connexions..."
          for i in $(seq 1 30); do
            docker exec mariadb mariadb-admin ping -h 127.0.0.1 -u root -pglpi_password --silent && break
            sleep 2
          done

      - name: Démarre GLPI (auto-installation via l'image officielle)
        run: |
          docker run -d --name glpi --network assetsign-ci \
            -e TIMEZONE=Europe/Paris \
            -e GLPI_DB_HOST=mariadb \
            -e GLPI_DB_PORT=3306 \
            -e GLPI_DB_NAME=glpidb \
            -e GLPI_DB_USER=glpi_user \
            -e GLPI_DB_PASSWORD=glpi_password \
            "$GLPI_IMAGE"

          # Piege reel rencontre au premier lancement de ce workflow :
          # GLPI_DB_PORT manquant faisait considerer la config DB comme
          # "incomplete" par l'entrypoint de l'image, qui desactivait alors
          # silencieusement l'auto-installation (GLPI_SKIP_AUTOINSTALL force
          # a true) — le noyau GLPI demarre quand meme sans DB configuree,
          # donc une simple verification "le noyau demarre" ne suffit pas a
          # detecter ce cas : on attend explicitement le fichier que
          # l'auto-installation cree en dernier (config_db.php), avec un
          # arret net et les logs du conteneur si ca n'arrive jamais.
          echo "Attente que l'auto-installation de GLPI soit terminee..."
          ready=0
          for i in $(seq 1 60); do
            docker exec glpi test -f /var/glpi/config/config_db.php && { ready=1; break; }
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::GLPI n'a jamais termine son auto-installation (config_db.php absent)."
            docker logs glpi --tail 200
            exit 1
          fi

      - name: Copie le plugin dans le conteneur GLPI
        run: |
          docker exec glpi mkdir -p /var/www/glpi/plugins/assetsign
          docker cp ./. glpi:/var/www/glpi/plugins/assetsign
          # Les fichiers copies appartiennent a root (l'utilisateur du
          # checkout), pas www-data (l'utilisateur sous lequel tourne PHP
          # dans ce conteneur, cf. les autres `docker exec` sans -u) : sans ce
          # chown, composer install echoue plus loin en tentant de creer de
          # nouveaux dossiers dans vendor/ ("does not exist and could not be
          # created" alors meme que le dossier a bien les droits d'ecriture
          # pour son PROPRE proprietaire root, juste pas pour www-data).
          docker exec -u root glpi chown -R www-data:www-data /var/www/glpi/plugins/assetsign

      - name: Lint PHP
        run: |
          docker exec glpi sh -c '
            cd /var/www/glpi/plugins/assetsign
            fail=0
            for f in $(find src front -name "*.php"); do
              php -l "$f" > /tmp/lintout 2>&1 || { cat /tmp/lintout; fail=1; }
            done
            exit $fail
          '

      - name: Installe les dépendances de dev du plugin (PHPUnit)
        # Le vendor/ commite dans le depot n'embarque volontairement QUE les
        # dependances de production (cf. INSTALLATION.md, section Prerequis) : PHPUnit
        # n'y est jamais present, il faut le recuperer ici. composer n'est pas
        # fourni par l'image glpi/glpi -> installe a la volee dans /tmp.
        # COMPOSER_HOME doit deja exister et etre exporte AVANT meme le script
        # d'installation de composer.phar lui-meme (pas seulement pour
        # `composer install` ensuite) : sans ca, ce script tente d'ecrire dans
        # le HOME par defaut de www-data, non inscriptible dans ce conteneur.
        #
        # COMPOSER_AUTH (github-oauth) ajoute le 2026-08-23 apres deux echecs
        # consecutifs de cette etape en HTTP 504 sur plusieurs paquets a la
        # fois (api.github.com/.../zipball/...) : composer telechargeait sans
        # authentification, donc soumis a la limite de taux GitHub la plus
        # basse (60 req/h) - le jeton du workflow (github.token, fourni
        # automatiquement, aucun secret a configurer) releve cette limite a
        # 5000 req/h et passe par un chemin plus fiable.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker exec glpi sh -c '
            export COMPOSER_HOME=/tmp/composer-home
            mkdir -p "$COMPOSER_HOME"
            cd /tmp
            php -r "copy(\"https://getcomposer.org/installer\", \"composer-setup.php\");"
            php composer-setup.php --install-dir=/tmp --filename=composer.phar
          '
          docker exec -e COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"$GH_TOKEN\"}}" glpi sh -c '
            export COMPOSER_HOME=/tmp/composer-home
            cd /var/www/glpi/plugins/assetsign
            php /tmp/composer.phar install --no-interaction --prefer-dist
          '

      - name: Analyse statique du code (PHPStan)
        # Bootstrap dedie (.phpstan-bootstrap.php) plutot que le vrai
        # front-controller GLPI : charge l'autoload de GLPI (classes
        # CommonDBTM, Session... utilisees par ce plugin) sans exiger de
        # connexion DB, seul necessaire pour de l'analyse statique. Quelques
        # faux positifs inevitables (methodes de hook GLPI type-hintees a la
        # classe parente CommonGLPI/CommonDBTM par obligation de signature)
        # sont documentes et ignores explicitement dans phpstan.neon.dist.
        run: docker exec glpi sh -c "cd /var/www/glpi/plugins/assetsign && vendor/bin/phpstan analyse --no-progress --memory-limit=512M"

      - name: Vérifie le standard de codage officiel GLPI
        # phpcs (pas phpcbf) : echoue la CI plutot que de corriger en silence,
        # jusqu'ici seulement lance manuellement en local (cf. TROUBLESHOOTING.md).
        run: docker exec glpi sh -c "cd /var/www/glpi/plugins/assetsign && vendor/bin/phpcs --standard=vendor/glpi-project/coding-standard/GlpiStandard/ruleset.xml src front hook.php setup.php"

      - name: Audit de sécurité des dépendances Composer
        # --no-dev : le vendor/ livre en production ne contient QUE les
        # dependances de prod (cf. INSTALLATION.md > Prerequis) ; sans ce filtre,
        # composer audit echoue systematiquement a cause de
        # glpi-project/coding-standard (dependance dev), marquee "abandoned"
        # sur Packagist - sans lien avec la securite, mais suffisant pour
        # faire echouer la commande (verifie en local avant d'ecrire cette
        # etape). Jusqu'ici seulement lance manuellement (cf. TROUBLESHOOTING.md).
        run: docker exec glpi sh -c "cd /var/www/glpi/plugins/assetsign && export COMPOSER_HOME=/tmp/composer-home && php /tmp/composer.phar audit --no-dev"

      - name: Installe et active le plugin
        run: |
          # database:update en amont, idempotent (no-op si deja a jour) :
          # regression reelle constatee au passage a glpi/glpi:11.0.8 - la
          # presence de config_db.php (utilisee plus haut pour detecter la fin
          # de l'auto-installation) ne garantit plus a elle seule que le schema
          # est totalement migre sur cette image.
          #
          # Boucle de nouvelle tentative plutot qu'un appel unique : un
          # premier correctif (appel simple de database:update) s'est revele
          # INSUFFISANT en conditions reelles (echec constate sur le push de
          # fusion vers main, cf. TROUBLESHOOTING.md) - a ce stade, la colonne
          # version de glpi_configs peut encore contenir le marqueur interne
          # "FILLED AT INSTALL" (l'auto-installation de l'image n'a pas fini
          # d'ecrire sa PROPRE configuration), que database:update refuse de
          # traiter ("Upgrade from version lower than 0.85.5 is not
          # supported"). config_db.php ne suffit donc pas non plus a detecter
          # CETTE etape-la de l'auto-installation. Plutot que d'essayer de
          # deviner un nouveau signal de fin plus fiable, une boucle de
          # nouvelles tentatives (jusqu'a 12 x 5s) absorbe cette course
          # quelle que soit sa cause exacte.
          ready=0
          for i in $(seq 1 12); do
            if docker exec glpi php bin/console database:update --force --no-interaction; then
              ready=1
              break
            fi
            echo "database:update pas encore pret (tentative $i/12), nouvel essai dans 5s..."
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::database:update a echoue apres 12 tentatives."
            exit 1
          fi
          docker exec glpi php bin/console plugin:install assetsign --force --no-interaction
          docker exec glpi php bin/console plugin:activate assetsign --no-interaction

      - name: Installe pcov (couverture de code)
        # pcov (pas Xdebug) : ni l'un ni l'autre n'est present dans l'image
        # glpi/glpi (production, pas de driver de couverture par defaut), mais
        # pcov compile en quelques secondes via pecl (chaine de compilation
        # deja presente dans l'image - gcc/make/phpize) contre plusieurs
        # minutes pour Xdebug, pour le meme resultat ici (juste mesurer la
        # couverture, pas de debogage pas-a-pas). Root necessaire : www-data
        # ne peut pas ecrire dans /usr/local/lib/php/extensions.
        run: docker exec -u root glpi sh -c "pecl install pcov"

      - name: Lance PHPUnit (avec couverture)
        # --coverage-text uniquement (pas d'upload Codecov) : aucun compte
        # Codecov lie a ce depot, un artefact de couverture sans tableau de
        # bord pour l'exploiter n'apporterait rien - le resume texte dans les
        # logs de la CI suffit a repondre a la question "quelle proportion du
        # code est testee ?" sans dependance externe.
        #
        # memory_limit=512M (le defaut de l'image glpi/glpi est 128M) : la
        # collecte de couverture pcov accumule en memoire les lignes executees
        # de TOUTE la suite, un cout qui grandit avec le nombre de tests -
        # panne reelle rencontree en CI (OutOfMemoryError dans
        # Toolbox::getMime()/finfo, pendant la generation d'un PDF par un test
        # preexistant sans lien avec la fonctionnalite du commit qui a
        # declenche l'echec) alors que la meme suite, la meme commande,
        # passait systematiquement en local (Docker) - 128M etait deja
        # limite, cf. le meme constat sur phpstan (phpstan.neon.dist ne fixe
        # pas non plus de memoire, --memory-limit=512M necessaire en local).
        run: docker exec glpi sh -c "cd /var/www/glpi/plugins/assetsign && php -d extension=pcov.so -d memory_limit=512M vendor/bin/phpunit --coverage-text"

      - name: Logs GLPI (en cas d'échec)
        if: failure()
        run: docker logs glpi --tail 200

  semgrep:
    # Analyse par motifs (SAST) : distincte de Trivy plus haut, qui couvre
    # secrets/mauvaises configurations/vulnérabilités connues des dépendances
    # mais ne détecte pas des patterns de code dangereux (ex: injection SQL,
    # usage risqué d'une fonction PHP) - deux outils complémentaires, pas
    # redondants. Job séparé (pas une étape du job "test") : ne nécessite ni
    # PHP ni Docker/GLPI, s'exécute directement sur le checkout, indépendamment
    # du reste de la CI.
    #
    # Pas de `continue-on-error` (retire le 2026-08-12) : ce job fait partie
    # des status checks requis sur `main` depuis la meme date - le laisser
    # tolerant a l'echec aurait rendu cette exigence purement cosmetique (le
    # job "reussirait" meme si semgrep trouvait une vraie faille). Contrepartie
    # assumee : un `docker pull semgrep/semgrep` qui echoue (indisponibilite/
    # rate-limit Docker Hub, deja observe une fois, jamais reproduit depuis)
    # bloquera aussi la PR - a relancer manuellement le cas echeant, plutot
    # que de rendre le check muet sur les vraies failles pour eviter ce cas rare.
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Récupère le code du plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep gha-mutable-action-tag)
      - run: semgrep ci --config auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  validation:
    # Verifie que les fichiers de configuration du depot sont bien formes,
    # independamment de tout Docker/GLPI - ecart constate face a la CI du
    # plugin jumeau Configuration-glpi-auto, qui a ce filet alors qu'ici un
    # JSON/YAML/XML mal forme (composer.json, docs/assetsign.xml...) n'etait
    # detecte qu'au moment ou l'outil qui le consomme echouait dessus
    # (composer, phpunit...), pas explicitement ni au meme endroit a chaque
    # fois.
    runs-on: ubuntu-latest
    steps:
      - name: Récupère le code du plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep gha-mutable-action-tag)

      - name: Valide les fichiers JSON
        run: |
          find . -type f -name "*.json" -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./.git/*" \
            | xargs -I {} sh -c 'echo "Validation de {}" && jq empty {} || exit 1'

      - name: Installe yamllint
        run: pip install --quiet yamllint

      - name: Valide les fichiers YAML
        run: |
          find . -type f \( -name "*.yml" -o -name "*.yaml" \) -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./.git/*" \
            | xargs -I {} sh -c 'echo "Validation de {}" && yamllint -c .yamllint.yml {} || exit 1'

      - name: Installe xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Valide les fichiers XML
        run: |
          find . -type f -name "*.xml*" -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./.git/*" \
            | xargs -I {} sh -c 'echo "Validation de {}" && xmllint --noout {} || exit 1'

  locales:
    # #91 : detecte une chaine __()/_n() ajoutee au code sans etre propagee a
    # locales/*.po - exactement la derive qui a laisse ~77 chaines (passeport
    # materiel, score de sante, don/vente...) sans traduction pendant
    # plusieurs sprints avant d'etre remarquee. Independant de Docker/GLPI,
    # comme "validation"/"semgrep" ci-dessus : regenere le .pot a partir du
    # code actuel (vendor/bin/extract-locales, meme outil qu'un contributeur
    # humain utiliserait a la main, pas une regex maison) et echoue si une
    # chaine qu'il trouve n'a pas de traduction dans une des 5 langues.
    runs-on: ubuntu-latest
    steps:
      - name: Récupère le code du plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep gha-mutable-action-tag)

      - name: Installe composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/tmp --filename=composer.phar

      - name: Installe les dépendances (dont l'outil d'extraction glpi-project/tools)
        # github.token (fourni automatiquement, aucun secret a configurer) evite
        # de retomber sur la limite de taux GitHub non authentifiee (60 req/h) -
        # meme raisonnement que le job "test" ci-dessus, apres deux echecs HTTP
        # 504 constates en pratique sur cette meme etape.
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: php /tmp/composer.phar install --no-interaction --prefer-dist

      - name: Installe gettext
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gettext

      - name: Régénère le .pot à partir du code actuel
        run: |
          vendor/bin/extract-locales
          # La derniere etape de extract-locales regenere en_GB.po depuis
          # zero via msginit (le msgid francais recopie comme msgstr, ecrasant
          # les vraies traductions anglaises) - annule ca pour verifier
          # en_GB.po de la meme facon que les 4 autres langues : fusionne
          # contre le .pot frais, pas regenere a l'aveugle.
          git checkout -- locales/en_GB.po

      - name: Vérifie que chaque langue traduit chaque chaîne extraite
        run: |
          status=0
          for lang in fr_FR en_GB de_DE es_ES it_IT; do
            msgmerge --no-fuzzy-matching --quiet -o /tmp/merged_${lang}.po locales/${lang}.po locales/assetsign.pot
            missing=$(msgattrib --untranslated /tmp/merged_${lang}.po | grep -c '^msgid "[^"]' || true)
            if [ "$missing" -gt 0 ]; then
              echo "::error::${lang}.po est incomplet : ${missing} chaîne(s) du code sans traduction"
              msgattrib --untranslated /tmp/merged_${lang}.po | grep '^msgid "[^"]'
              status=1
            fi
          done
          exit $status
