name: CodeQL

# Analyse statique de securite (SQLi, XSS, etc.) du code PHP du plugin.
# Gratuit sur un depot public (Advanced Security). Resultats visibles dans
# l'onglet Security > Code scanning du depot.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # tous les lundis, pour capter les nouvelles regles CodeQL

jobs:
  analyze:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php

      - name: Analyse
        uses: github/codeql-action/analyze@v3
